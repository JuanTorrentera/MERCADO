<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mercado Analytics</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <header>
        <h1 style="color: #00d4ff;">Mercado</h1>
        <nav>
            <button class="tab-btn active" onclick="cambiarModulo('tarifas')">Tarifas CFE</button>
            <button class="tab-btn" onclick="cambiarModulo('reservas')">Reservas</button>
            <button class="tab-btn" onclick="cambiarModulo('mda')">Precios MDA</button>
            <button class="tab-btn" onclick="cambiarModulo('mtr')">Precios MTR</button>
        </nav>
    </header>

    <main>
        <h2 id="modulo-titulo">Tarifas</h2>
        <div id="filtros-container" class="filtros-grid"></div>
        <button class="btn-ejecutar" onclick="ejecutar()">EJECUTAR ANÁLISIS</button>

        <div class="stats-grid">
            <div class="stat-card"><h3>PROMEDIO</h3><p id="stat-promedio">-</p></div>
            <div class="stat-card"><h3>MÁXIMO</h3><p id="stat-maximo">-</p></div>
            <div class="stat-card"><h3>MÍNIMO</h3><p id="stat-minimo">-</p></div>
            <div class="stat-card"><h3>REGISTROS</h3><p id="stat-registros">-</p></div>
        </div>

        <div id="grafica-total" class="chart-container" style="margin-bottom: 20px; display: none;"></div>
        <div id="grafica-componentes" class="chart-container" style="margin-bottom: 20px; display: none;"></div>
        
        <div id="grafica-energia" class="chart-container" style="margin-bottom: 20px; display: none;"></div>
        <div id="grafica-potencia" class="chart-container" style="margin-bottom: 20px; display: none;"></div>
        <div id="grafica-usuarios" class="chart-container" style="margin-bottom: 20px; display: none;"></div>

        <div id="grafica-estadistica" class="chart-container" style="margin-bottom: 20px; display: none;"></div>

    </main>
    <script src="/js/main.js"></script>
</body>
</html>
